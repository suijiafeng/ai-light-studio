# ============================================
# 代码工匠 · AI灯光设计 — Docker Compose 部署
#
# 首次使用:
#   cp server/.env.example server/.env   # 按需修改配置（JWT_SECRET等）
#   docker compose up -d --build
#   打开 http://localhost:3000
#
# 常用命令:
#   docker compose logs -f          # 查看日志
#   docker compose restart         # 重启
#   docker compose down            # 停止（数据保留在卷中）
#   docker compose up -d --build   # 代码更新后重新构建
# ============================================
services:
  ai-light-studio:
    build: .
    image: ai-light-studio:latest
    container_name: ai-light-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    # server/.env 不打进镜像，由这里在启动时注入
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # 数据库 + 上传图 + 生成结果图，全部持久化在命名卷中
      - app-data:/app/server/data
      # 对接真实微信支付时，取消下面注释挂载商户证书目录
      # - ./server/cert:/app/server/cert:ro

volumes:
  app-data:
