<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    // 渲染前按用户偏好设置主题，避免刷新时明暗闪变
    document.documentElement.classList.toggle('dark', localStorage.getItem('theme') !== 'light')
    // 首屏渲染期间禁用一切过渡/动画，避免刷新时元素闪动
    document.documentElement.classList.add('boot-lock')
    window.addEventListener('load', () => setTimeout(() => document.documentElement.classList.remove('boot-lock'), 80))
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代码工匠 · AI灯光设计工具</title>
  <meta name="description" content="上传室内实景照片，AI智能重绘空间灯光效果，一键生成多种灯光氛围方案" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
